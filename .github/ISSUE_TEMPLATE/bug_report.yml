name: Bug report
description: Something is not working as documented.
labels: ['bug', 'needs-triage']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. The faster I can reproduce it, the faster I can fix it.

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: One paragraph. What did you expect, what did you observe?
      placeholder: |
        I expected the banner to render Día de las Velitas on Dec 7. Instead I saw an empty page and a console error...
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: Steps a stranger could follow to reach the same broken state. A code snippet, an HTML page, or a link to a deployed example.
      render: markdown
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: seasonly version
      placeholder: e.g. 0.1.0 (npm) or git SHA (CDN/raw)
    validations:
      required: true

  - type: dropdown
    id: how-loaded
    attributes:
      label: How was the library loaded?
      options:
        - npm install (bundler)
        - CDN, ESM (jsDelivr / unpkg)
        - CDN, auto-init script (`src/auto.js`)
        - Local clone with `npm run dev`
        - Other (describe in repro)
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser + OS
      placeholder: e.g. Chrome 134 on Windows 11, Safari 18 on macOS 15
    validations:
      required: true

  - type: dropdown
    id: reduced-motion
    attributes:
      label: Was system "Reduce motion" turned on?
      options:
        - 'No / default'
        - 'Yes'
        - 'Tested both, same result'
        - 'Not sure'
    validations:
      required: true

  - type: input
    id: calendar
    attributes:
      label: Which calendar were you using?
      placeholder: e.g. bundled `co`, bundled `global`, custom URL, inline object
    validations:
      required: false

  - type: input
    id: effect
    attributes:
      label: Which particle effect was active (if any)?
      placeholder: e.g. snowflakes, candles, none
    validations:
      required: false

  - type: textarea
    id: console
    attributes:
      label: Browser console output
      description: Copy any errors or warnings printed when the bug happens.
      render: text
    validations:
      required: false
